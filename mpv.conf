# ################################################################
#
#   MPV 统一配置文件
#   分为全局设置与按机器性能切换的 profile 两部分
#   profile 定义在 profiles.conf，由本文件末尾 include 引入
#
# ################################################################

# ================================================================
#  渲染后端
# ================================================================
vo=gpu-next
gpu-api=d3d11                   # Windows 首选，HDR 直通最稳定
hwdec=d3d11va                   # D3D11VA 硬件解码
hwdec-codecs=all                # 对所有编码格式启用硬解

# ================================================================
#  色彩管理（HDR/SDR 自动适配）
# ================================================================
target-colorspace-hint=auto     # 根据 Windows 当前 HDR 状态选择输出色彩空间
target-trc=auto                 # SDR/HDR 输出随目标显示器状态自动选择
target-peak=auto                # 使用目标显示器或 transfer function 的默认峰值
tone-mapping=auto               # 由 gpu-next 选择适合目标显示器的 HDR 映射
gamut-mapping-mode=auto         # 按目标色域自动处理 BT.2020 到 SDR 的转换
hdr-compute-peak=no             # 关闭逐帧峰值计算，避免 AV1/HDR 全屏紫屏

# ================================================================
#  帧率与显示同步
# ================================================================
video-sync=display-resample     # 按显示器刷新率同步，减少周期性卡顿
interpolation=no                # 保留原始帧，不使用插帧

# ================================================================
#  窗口与界面
# ================================================================
osc=no                          # 禁用内置控制栏，由 uosc 接管
osd-bar=no                      # 禁用内置进度条，由 uosc 接管
border=no                       # 隐藏系统标题栏与窗口边框
autofit-larger=50%x50%          # 初始窗口尺寸不超过屏幕的 50%
geometry=50%:50%                # 启动时窗口居中显示
keep-open=yes                   # 播放结束后保持窗口，不自动退出

# ================================================================
#  字幕（简体中文优先）
# ================================================================
sub-auto=fuzzy                  # 模糊匹配同名字幕文件
slang=chs,sc,zh-Hans,zh-CN,cht,tc,zh-Hant,zh-HK,zh-TW,chi,zho,zh
sub-scale=1.5                   # SRT 字幕默认放大 1.5 倍（ASS 字幕不受影响）
sub-font="LXGW WenKai"         # 霞鹜文楷，笔画优美
sub-border-size=2               # 描边粗细
sub-shadow-offset=1             # 阴影偏移
sub-color="#FFFFFF"             # 白色字体
sub-border-color="#000000"      # 黑色描边
sub-shadow-color="#000000"      # 黑色阴影

# ================================================================
#  音轨
# ================================================================
# 不设置 alang，让 MPV 使用媒体文件的 default 标记或容器顺序选择音轨。

# ================================================================
#  网络播放与缓冲
# ================================================================
cache=yes
demuxer-max-bytes=2048MiB       # 前向缓冲，网络串流够用
demuxer-max-back-bytes=256MiB   # 后向缓冲，用于回跳
cache-pause=no                  # 缓冲期间不暂停，保持播放

# ================================================================
#  输入
# ================================================================
no-input-default-bindings       # 禁用所有默认快捷键，仅 input.conf 中的生效

# ================================================================
#  其他
# ================================================================
load-stats-overlay=no
script-opts=ytdl_hook-ytdl_path=~~/../yt-dlp.exe


# ================================================================
#  截图
# ================================================================
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~~/screenshots

include=~~/profiles.conf
